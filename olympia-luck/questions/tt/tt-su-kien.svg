<svg xmlns="http://www.w3.org/2000/svg" width="1008" height="679" viewBox="0 0 1008 679" font-family="Verdana, Arial, 'Helvetica Neue', sans-serif">
<rect x="2" y="2" width="1004" height="675" rx="22" fill="#0b1a3f" stroke="#3a5a9a" stroke-width="3"/>
<rect x="60" y="60" width="434" height="270" rx="18" fill="#13285a" stroke="#3a5a9a" stroke-width="2"/>
<circle cx="112" cy="112" r="30" fill="#f2c94c"/><text x="112" y="112" font-size="34" fill="#241900" text-anchor="middle" font-weight="800" dominant-baseline="central">A</text>
<text x="90" y="180" font-size="28" fill="#ffffff" text-anchor="start" font-weight="600" dominant-baseline="central">Ngô Quyền đánh tan quân</text>
<text x="90" y="222" font-size="28" fill="#ffffff" text-anchor="start" font-weight="600" dominant-baseline="central">Nam Hán trên sông Bạch</text>
<text x="90" y="264" font-size="28" fill="#ffffff" text-anchor="start" font-weight="600" dominant-baseline="central">Đằng</text>
<rect x="514" y="60" width="434" height="270" rx="18" fill="#13285a" stroke="#3a5a9a" stroke-width="2"/>
<circle cx="566" cy="112" r="30" fill="#f2c94c"/><text x="566" y="112" font-size="34" fill="#241900" text-anchor="middle" font-weight="800" dominant-baseline="central">B</text>
<text x="544" y="180" font-size="28" fill="#ffffff" text-anchor="start" font-weight="600" dominant-baseline="central">Lý Công Uẩn dời đô từ</text>
<text x="544" y="222" font-size="28" fill="#ffffff" text-anchor="start" font-weight="600" dominant-baseline="central">Hoa Lư ra Đại La, đổi</text>
<text x="544" y="264" font-size="28" fill="#ffffff" text-anchor="start" font-weight="600" dominant-baseline="central">tên thành Thăng Long</text>
<rect x="60" y="350" width="434" height="270" rx="18" fill="#13285a" stroke="#3a5a9a" stroke-width="2"/>
<circle cx="112" cy="402" r="30" fill="#f2c94c"/><text x="112" y="402" font-size="34" fill="#241900" text-anchor="middle" font-weight="800" dominant-baseline="central">C</text>
<text x="90" y="470" font-size="28" fill="#ffffff" text-anchor="start" font-weight="600" dominant-baseline="central">Hai Bà Trưng phất cờ</text>
<text x="90" y="512" font-size="28" fill="#ffffff" text-anchor="start" font-weight="600" dominant-baseline="central">khởi nghĩa chống quân</text>
<text x="90" y="554" font-size="28" fill="#ffffff" text-anchor="start" font-weight="600" dominant-baseline="central">Đông Hán</text>
<rect x="514" y="350" width="434" height="270" rx="18" fill="#13285a" stroke="#3a5a9a" stroke-width="2"/>
<circle cx="566" cy="402" r="30" fill="#f2c94c"/><text x="566" y="402" font-size="34" fill="#241900" text-anchor="middle" font-weight="800" dominant-baseline="central">D</text>
<text x="544" y="470" font-size="28" fill="#ffffff" text-anchor="start" font-weight="600" dominant-baseline="central">Chiến dịch Điện Biên Phủ</text>
<text x="544" y="512" font-size="28" fill="#ffffff" text-anchor="start" font-weight="600" dominant-baseline="central">toàn thắng</text>
</svg>
